name: Production compilation

on:
  # This maintained fork integrates on master; upstream SimpleMarketBoard uses main.
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  render-safety:
    runs-on: windows-latest
    steps:
      - name: Check out ComplicatedMarketBoard
        uses: actions/checkout@v6
        with:
          path: ComplicatedMarketBoard

      - name: Read the required Franthropy revision
        id: franthropy
        shell: pwsh
        run: |
          [xml]$pin = Get-Content 'ComplicatedMarketBoard/eng/Franthropy.Version.props'
          $revision = ([string]$pin.Project.PropertyGroup.FranthropyPackageVersion).Replace('0.1.0-commit.', '')
          if ($revision -notmatch '^[0-9a-f]{40}$') {
            throw 'Invalid Franthropy package pin.'
          }
          "revision=$revision" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Check out the pinned Franthropy revision
        uses: actions/checkout@v6
        with:
          repository: FranFkntastic/Franthropy
          ref: ${{ steps.franthropy.outputs.revision }}
          path: Franthropy

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Prepare Dalamud SDK references
        shell: pwsh
        run: |
          $sdkReferenceRoot = Join-Path $env:RUNNER_TEMP 'cmb-build-references'
          $sdkRoot = Join-Path $sdkReferenceRoot 'XIVLauncher/addon/Hooks/dev'
          $sdkArchive = Join-Path $env:RUNNER_TEMP 'dalamud-sdk.zip'
          Invoke-WebRequest 'https://goatcorp.github.io/dalamud-distrib/latest.zip' -OutFile $sdkArchive
          Expand-Archive -LiteralPath $sdkArchive -DestinationPath $sdkRoot
          foreach ($assembly in @('Dalamud', 'Dalamud.Bindings.ImGui', 'Dalamud.Bindings.ImPlot', 'Dalamud.Bindings.ImGuizmo', 'FFXIVClientStructs', 'InteropGenerator.Runtime', 'Newtonsoft.Json', 'Lumina', 'Lumina.Excel', 'Serilog', 'Microsoft.Extensions.ObjectPool')) {
            if (-not (Test-Path -LiteralPath (Join-Path $sdkRoot "$assembly.dll"))) {
              throw "Missing Dalamud SDK reference: $assembly.dll"
            }
          }
          "DALAMUD_HOME=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CMB_SDK_REFERENCE_ROOT=$sdkReferenceRoot" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Keep the required status ID, but do not claim behavioral safety from compilation.
      - name: Compile production plugin
        working-directory: ComplicatedMarketBoard
        run: dotnet build ComplicatedMarketBoard/ComplicatedMarketBoard.csproj -c Release -p:FranthropySource=Local "-p:FranthropyRoot=$env:GITHUB_WORKSPACE/Franthropy" "-p:AppData=$env:CMB_SDK_REFERENCE_ROOT"
